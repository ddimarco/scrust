[package]
name = "scrust"
version = "0.1.0"
authors = ["Daniel Di Marco <d.dimarco@gmx.de>"]
edition = "2021"

[profile.release]
# enable debug symbols in release
debug = true

[profile.dev]
lto = false
rpath = false
opt-level = 0
codegen-units = 4  # controls whether the compiler passes `-C codegen-units`
# `codegen-units` is ignored when `lto = true      `

[dependencies]
sdl2 = "0.34"
byteorder = "1.5"
libc = "0.2"
# enum_primitive is deprecated, use num-derive + num-traits instead
num-derive = "0.4"
num-traits = "0.2"
num = "0.4"
rand = "0.8"
ecs = "0.23"
bresenham = "0.1"
config = "0.14"

[dependencies.scformats]
path = "src/scformats"

[dependencies.pathplanning]
path = "src/pathplanning"

[dependencies.smacker]
path = "src/smacker-rs"

[dev-dependencies]
bencher = "*"

[[bench]]
name="render_buf"
harness=false
